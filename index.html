<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meja Pegawai</title>
    <style>
        /* Reset total: hilangkan margin, padding, dan scrollbar */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Iframe menutupi seluruh viewport */
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: 0;
            display: block;
        }
    </style>
</head>
<body>
<iframe 
    src="gcp-meja-pegawai.wedhiaccess.workers.dev" 
    title="Aplikasi Google Apps Script yang Aman"
    allow="clipboard-write"
></iframe>
</body>
</html>
